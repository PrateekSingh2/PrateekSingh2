name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/profile-3d-contrib.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contrib images
        uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: "100"

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib || true
          git diff --cached --quiet && echo "No 3D contrib changes" && exit 0
          git commit -m "chore: refresh 3D contribution graph"
          git push
